# Publish LoxBerry plugin updates to separate stable and beta channels.
# A release-* branch or v* tag must contain the exact VERSION in plugin.cfg.
name: Publish LoxBerry update channel
on:
  push:
    branches:
      - 'release-*'
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: loxberry-release-metadata
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate version and update only its channel
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_TYPE" = "branch" ]; then
            [[ "$SOURCE_REF" == release-* ]] || exit 1
            VERSION="${SOURCE_REF#release-}"
            ARCHIVE="https://github.com/$REPOSITORY/archive/refs/heads/$SOURCE_REF.zip"
            SOURCE="refs/heads/$SOURCE_REF"
          elif [ "$SOURCE_TYPE" = "tag" ]; then
            [[ "$SOURCE_REF" == v* ]] || exit 1
            VERSION="${SOURCE_REF#v}"
            ARCHIVE="https://github.com/$REPOSITORY/archive/refs/tags/$SOURCE_REF.zip"
            SOURCE="refs/tags/$SOURCE_REF"
          else
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          git fetch origin "$SOURCE"
          INSTALLED="$(git show FETCH_HEAD:plugin.cfg | sed -n 's/^VERSION=//p' | head -1 | tr -d '\r')"
          [ "$VERSION" = "$INSTALLED" ] || { echo "Version mismatch: $VERSION vs $INSTALLED"; exit 1; }
          INFO="https://github.com/$REPOSITORY/blob/main/CHANGELOG.md"
          if [[ "$VERSION" == *-* ]]; then
            FILE=prerelease.cfg
          else
            FILE=release.cfg
          fi
          printf '[AUTOUPDATE]\n# Generated by .github/workflows/release.yml\nVERSION=%s\nARCHIVEURL=%s\nINFOURL=%s\n' "$VERSION" "$ARCHIVE" "$INFO" > "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Update LoxBerry $FILE to $VERSION"
            git push origin HEAD:main
          fi
