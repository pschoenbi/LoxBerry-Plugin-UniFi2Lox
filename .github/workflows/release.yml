# Trägt eine neue Plugin-Version in release.cfg / prerelease.cfg ein,
# damit alle LoxBerrys das Update finden. Läuft automatisch bei:
#   - einem Release-Branch   release-1.2.0          (so veröffentlicht Claude)
#   - einem Versions-Tag     v1.2.0                 (oder ein GitHub-Release)
# Versionen mit Bindestrich (release-1.2.0-beta1 / v1.2.0-beta1) gelten als
# Testversion und landen nur in prerelease.cfg.
name: Release für LoxBerry eintragen
on:
  push:
    branches: ['release-*']
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
jobs:
  update-cfg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Version prüfen und release.cfg schreiben
        run: |
          REF="${{ github.event.release.tag_name || github.ref_name }}"
          case "$REF" in
            release-*) VER="${REF#release-}"; KIND=heads ;;
            *)         VER="${REF#v}";        KIND=tags  ;;
          esac
          CFGVER=$(git show "origin/$REF:plugin.cfg" 2>/dev/null || git show "$REF:plugin.cfg")
          CFGVER=$(echo "$CFGVER" | grep -m1 '^VERSION=' | cut -d= -f2)
          if [ "$VER" != "$CFGVER" ] && [ "${VER%%-*}" != "$CFGVER" ]; then
            echo "::error::$REF passt nicht zu VERSION=$CFGVER in plugin.cfg"; exit 1
          fi
          URL="https://github.com/${{ github.repository }}/archive/refs/$KIND/$REF.zip"
          INFO="https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          write() { printf '[AUTOUPDATE]\n# Automatisch erzeugt durch .github/workflows/release.yml\nVERSION=%s\nARCHIVEURL=%s\nINFOURL=%s\n' "$VER" "$URL" "$INFO" > "$1"; }
          write prerelease.cfg
          PRE="${{ github.event.release.prerelease }}"
          case "$VER" in *-*) PRE=true ;; esac
          if [ "$PRE" != "true" ]; then write release.cfg; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add release.cfg prerelease.cfg
          git commit -m "LoxBerry-Update auf $VER" || echo "nichts zu ändern"
          git push origin HEAD:main
