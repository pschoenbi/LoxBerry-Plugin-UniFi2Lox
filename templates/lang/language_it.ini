LOX_STEP3="Inserire <b>nome utente</b> {0} e <b>password</b> (vedi «Server» qui sotto) – entrambi gli URL usano le stesse credenziali."
LOX_STEP4="Opzionale senza credenziali: usare l’URL dell’immagine con <code>&amp;key=…</code>."
LOX_STEP5="Collegare il blocco <b>Controllo porta</b>/<b>Intercom</b> all’intercom e salvare nel Miniserver."

